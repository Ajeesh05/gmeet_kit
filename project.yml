name: gmeet-kit
type: chrome-extension

# audit   - propose findings only, never write code
# propose - may implement, always via a PR you review
# full    - may implement and auto-merge on green CI
#
# The crash that justified audit is fixed: normalizeMeetingId is defined and
# covered by tests, the undeclared chrome.scripting call is gone, and the lint
# baseline is down to the 2 implicit globals inside the protected
# "choose your meeting url" feature. CLAUDE.md's rule was that fixing those
# moves this project to `propose` - left at audit for a human to make that call,
# since it widens what an agent may do here.
autonomy: audit

source:
  root: .

store:
  publisher_id: "256487ad-a5b8-4f55-a685-1070701ad9ba"
  item_id: "mdoigaefpjglamcdlailnincbmfomlkj"

permissions:
  baseline:
    - activeTab
    - storage
    - sidePanel
    - tabs
  host_baseline: []

test:
  unit: true
  e2e: true
  # E2E serves a stub over https at meet.google.com via --host-resolver-rules;
  # the real Meet requires a login and automating it would breach Google's ToS.
  e2e_notes: local-https-stub

versioning:
  strategy: semver

retry:
  max_dispatches: 2
